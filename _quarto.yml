project:
  type: book
  output-dir: docs

book:
  title: "Math Camp 2026"
  subtitle: "Math camp for the incoming Political Science PhD cohort"
  author:
    - Parushya
    - Rong Qin
  date: today
  repo-url: https://github.com/parushya/MathCamp2026
  page-footer:
    left: "Math Camp 2026, Government PhD Program"
    right: "Built with Quarto"
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - intro.qmd
    - part: chapters/01-notation-functions-limits/index.qmd
      chapters:
        - chapters/01-notation-functions-limits/slides.qmd
        - chapters/01-notation-functions-limits/programming.qmd
    - part: chapters/02-probability/index.qmd
      chapters:
        - chapters/02-probability/slides.qmd
        - chapters/02-probability/programming.qmd
    - part: chapters/03-calculus-differentiation/index.qmd
      chapters:
        - chapters/03-calculus-differentiation/slides.qmd
        - chapters/03-calculus-differentiation/programming.qmd
    - part: chapters/04-calculus-integration/index.qmd
      chapters:
        - chapters/04-calculus-integration/slides.qmd
        - chapters/04-calculus-integration/programming.qmd
    - part: chapters/05-linear-algebra/index.qmd
      chapters:
        - chapters/05-linear-algebra/slides.qmd
        - chapters/05-linear-algebra/programming.qmd
  appendices:
    - chapters/references.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    number-sections: true
    code-fold: true
    code-tools: true

editor: source
