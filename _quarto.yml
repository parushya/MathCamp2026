project:
  type: book
  output-dir: docs

execute:
  freeze: auto

book:
  title: "Math and Programming Camp 2026"
  subtitle: "Department of Government, Georgetown University"
  author:
    - Parushya
    - Rong Qin
  date: today
  repo-url: https://github.com/parushya/MathCamp2026
  page-footer:
    left: "Government PhD Program"
    right: "Georgetown University"
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - intro.qmd
    - part: chapters/01-notation-functions-limits/index.qmd
      chapters:
        - chapters/01-notation-functions-limits/slides.qmd
        - chapters/01-notation-functions-limits/programming.qmd
    - part: chapters/02-probability/index.qmd
      chapters:
        - chapters/02-probability/slides.qmd
        - chapters/02-probability/programming.qmd
    - part: chapters/03-calculus/index.qmd
      chapters:
        - chapters/03-calculus/slides.qmd
        - chapters/03-calculus/programming.qmd
    - part: chapters/04-linear-algebra/index.qmd
      chapters:
        - chapters/04-linear-algebra/slides.qmd
        - chapters/04-linear-algebra/programming.qmd
    - part: chapters/05-advanced-topics/index.qmd
      chapters:
        - chapters/05-advanced-topics/slides.qmd
        - chapters/05-advanced-topics/programming.qmd
  appendices:
    - chapters/references.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    number-sections: false
    code-fold: true
    code-tools: true
    lightbox: true

editor: source
